faq:
  title: Frequently Asked Questions
  description: Clear answers about my services, technical background, and work models.
  categories:
    - title: Services & Work Models
      questions:
        - label: What solutions and services do you offer?
          content: |
            I design, develop, and deploy end-to-end custom web applications and systems: from tailored tools for small businesses, entrepreneurs, and SMBs (income and expense tracking, administrative workflows, case or inventory tracking, and reporting dashboards) to internal institutional platforms, migrating legacy desktop applications to the web, and containerizing environments. I also advise clients on the most cost-effective deployment strategy for their budget—from repurposing local hardware with Linux (Ubuntu/Debian) and Docker to VPS hosting or cloud platforms like Vercel.
        - label: What is your methodology for new projects or legacy systems?
          content: |
            For greenfield projects, I apply **Spec Driven Development (SDD)** within an agile **Scrum** framework, turning business requirements into clear technical specifications and iterative releases. When modernizing legacy systems (such as migrating Visual Basic 6 and SQL Server 2005 desktop applications to PostgreSQL), I implement progressive data-scrubbing workflows inspired by the **Strangler Fig** pattern—using guided data-cleaning assistants to resolve historical inconsistencies even when organizational constraints require preserving the original database structure.
        - label: What work arrangements or engagement models are you looking for?
          content: |
            I am available under two main models: **1) Remote roles** (Full-Time or Contractor) joining national or international engineering teams as a Full Stack Developer with a DevOps focus, and **2) Project-based custom web development** for businesses, startups, or organizations looking to digitize and automate their internal operations.
    - title: "Tech Stack, DevOps & Workflow"
      questions:
        - label: "What is your core technology stack?"
          content: |
            My core stack combines **Laravel, Nuxt, Vue.js, Inertia.js, TypeScript, and Tailwind CSS**, backed by **PostgreSQL and Redis** for the data layer and **Docker + Nginx on Linux** for infrastructure. I also have hands-on experience maintaining, debugging, and extending existing systems built with **Yii2, CodeIgniter, React**, and third-party ERP platforms. You can explore the full list in my [About Me](/about) section.
        - label: "What hands-on experience do you have with DevOps and CI/CD automation?"
          content: |
            I have designed and implemented end-to-end **CI/CD pipelines on self-hosted GitLab instances using GitLab Runners** across multiple production systems. My pipelines automate static analysis and code style checks (**Laravel Pint, PHPStan, vue-tsc**), automated **Pest** test suites in isolated ephemeral **Docker Compose** environments, semantic auto-versioning, multi-stage Docker image builds (`app` + `Nginx`) pushed to a private **Container Registry**, and remote SSH deployments to QA and production servers.
        - label: "How do you integrate Artificial Intelligence into your engineering workflow?"
          content: |
            I use **Agentic AI** as an engineering copilot to accelerate code analysis, automated test authoring, refactoring, debugging, and technical documentation. Every architectural decision, data model, security policy, and business rule is strictly reviewed and validated under my professional judgment.
