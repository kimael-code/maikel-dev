seo:
  title: "Sobre Maikel Carballo | Trayectoria y Tecnologías"
  description: "Conoce a Maikel Carballo, Analista de Sistemas y Profesor de Informática. Más de 5 años creando soluciones con Laravel, Vue.js y Docker."
  keywords: "experiencia, biografía, profesor informática, sistemas analista"
title: Sobre Mí
description: Ser humano, hijo, felizmente acompañado, profesor, pro-gramador y pro-gamer.
intro: |
  ¡Hola! Soy Maikel Carballo, un apasionado Desarrollador Web Full Stack y Profesor de Informática residenciado en La Guaira, Venezuela. Mi objetivo principal es construir software de alta calidad que no solo cumpla con los requisitos técnicos, sino que también agilice los procesos y entregue valor real a las organizaciones.

  ### El Programador y Profesor

  Con una sólida trayectoria de más de cinco años, he tenido el privilegio de colaborar con importantes instituciones del sector público en Venezuela. Actualmente me desempeño como Analista de Sistemas en una institución financiera pública, responsable del desarrollo y mantenimiento de aplicaciones críticas para la gestión de procesos internos. Usando tecnologías como: PHP (Laravel, Yii2), Vue.js, Inertia.js, PostgreSQL y Docker. Mi experiencia también incluye mi rol como Analista Programador. Adicionalmente, he cultivado mi pasión por la enseñanza como Profesor de Programación en la Universidad Nueva Esparta, contribuyendo a la formación de futuros talentos en el campo de la tecnología.
