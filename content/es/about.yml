personal: |
  ### Más Allá de la Pantalla

  Fuera del código soy un ser humano familiar y felizmente acompañado 💞. Cuando no estoy programando, podrías encontrarme jugando Dragonheir: Silent Gods 🎮, escuchando buena música 🎵 o capturando momentos con la cámara 📸.

  Gracias por interesarte en mi camino profesional. Si crees que mi experiencia y enfoque pueden ayudarte a materializar tu próxima gran idea o resolver un reto técnico complejo, ¡estaré encantado de [conversar](https://bsky.app/profile/maikel-dev.bsky.social)! No olvides echar un vistazo a mis [proyectos](/es/projects).

  Si mi trabajo o mis proyectos te han sido de ayuda, ¡puedes apoyarme [invitándome a un café en Ko-fi](https://ko-fi.com/maikelcarballo)! Tu apoyo me motiva a seguir creando software de alta calidad. ☕🚀
