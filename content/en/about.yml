personal: |
  ### Beyond the Screen

  Beyond the code, I'm a family-oriented person and happily partnered 💞. When I'm not programming, you might find me playing Dragonheir: Silent Gods 🎮, listening to good music 🎵, or capturing moments with my camera 📸.

  Thank you for taking an interest in my professional journey. If you feel my experience and approach can help bring your next big idea to life or solve a complex technical challenge, I'd love to [chat](https://bsky.app/profile/maikel-dev.bsky.social)! Don't forget to take a look at my [projects](/projects).

  If my work or projects have been helpful to you, feel free to support me by [buying me a coffee on Ko-fi](https://ko-fi.com/maikelcarballo)! Your support fuels my passion for building high-quality software. ☕🚀
