about:
  title: "Sobre Mí"
  description: |
    ¡Hola! Soy Maikel Carballo, Desarrollador Web Full Stack con enfoque en prácticas DevOps y Profesor de Informática residenciado en La Guaira, Venezuela.
    Con más de 6 años de experiencia, diseño, construyo y automatizo el despliegue de aplicaciones web que modernizan procesos operativos, sanean datos heredados y entregan valor real a instituciones y negocios.
