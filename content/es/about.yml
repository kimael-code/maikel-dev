  title: "Sobre Maikel Carballo | Desarrollador Full Stack & DevOps"
  description: "Conoce a Maikel Carballo, Desarrollador Web Full Stack, Analista de Sistemas y Profesor de Informática con más de 6 años creando soluciones con Laravel, Vue.js, PostgreSQL y Docker."
