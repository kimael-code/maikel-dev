faq:
  title: "Preguntas Frecuentes"
  description: "Respuestas claras sobre mis servicios, experiencia técnica y modalidades de trabajo."
  categories:
    - title: "Servicios y Modalidades"
      questions:
        - label: "¿Qué soluciones y servicios ofreces?"
          content: |
            Diseño, desarrollo y despliego aplicaciones y sistemas web a medida de principio a fin: desde soluciones para negocios, emprendimientos y PYMES (control de ingresos y egresos, gestión administrativa, seguimiento de casos o inventarios y paneles de reportes) hasta sistemas internos institucionales, migración de aplicaciones de escritorio heredadas (*legacy*) hacia la web y contenedorización de entornos. Además, asesoro sobre la mejor alternativa de despliegue según el presupuesto del proyecto: desde reutilizar hardware local con Linux (Ubuntu/Debian) y Docker hasta servidores VPS o plataformas en la nube como Vercel.
        - label: "¿Cuál es tu metodología para proyectos nuevos o sistemas legacy?"
          content: |
            En desarrollos desde cero aplico **Spec Driven Development (SDD)** dentro de un marco ágil (**Scrum**), transformando requerimientos de negocio en especificaciones técnicas precisas y entregas iterativas. En la modernización de sistemas *legacy* (como migraciones desde Visual Basic 6 y SQL Server hacia PostgreSQL), implemento estrategias de saneamiento progresivo basadas en el patrón **Strangler Fig** y asistentes interactivos de depuración de datos, permitiendo limpiar inconsistencias históricas incluso cuando por restricciones operativas debe conservarse la estructura de datos original.
        - label: "¿Qué modalidades de trabajo o contratación buscas?"
          content: |
            Estoy disponible en dos modalidades principales: **1) Incorporación remota** (Full-Time o Contractor) en equipos de ingeniería nacionales o internacionales como Desarrollador Full Stack con enfoque DevOps, y **2) Desarrollo de sistemas web a medida por proyecto** para comercios, emprendimientos o empresas que necesiten digitalizar y automatizar sus operaciones.
    - title: "Tecnologías, DevOps y Flujo"
      questions:
        - label: "¿Cuál es tu stack tecnológico principal?"
          content: |
            Mi stack principal integra **Laravel, Nuxt, Vue.js, Inertia.js, TypeScript y Tailwind CSS**, respaldado por **PostgreSQL y Redis** en la capa de datos y **Docker + Nginx sobre Linux** en infraestructura. También cuento con experiencia dando soporte, corrigiendo incidencias y evolucionando sistemas construidos en **Yii2, CodeIgniter, React** y plataformas tipo ERP de terceros. Puedes consultar el listado completo en mi sección [Sobre Mí](/es/about).
        - label: "¿Qué experiencia práctica tienes en DevOps y automatización CI/CD?"
          content: |
            He diseñado e implementado flujos completos de **CI/CD en instancias self-hosted de GitLab con GitLab Runners** para múltiples sistemas en producción. Mis pipelines automatizan el análisis estático y de estilo (**Laravel Pint, PHPStan, vue-tsc**), la ejecución de pruebas con **Pest** en entornos efímeros aislados con **Docker Compose**, el versionado semántico automático, la construcción de imágenes multi-etapa (`app` + `Nginx`) en **Container Registry** privado y el despliegue remoto vía SSH hacia entornos de QA y producción.
        - label: "¿Cómo integras la Inteligencia Artificial en tu flujo de ingeniería?"
          content: |
            Utilizo **IA Agéntica** como copiloto de ingeniería para acelerar el análisis de código, la escritura de pruebas automatizadas, la refactorización, el *debugging* y la documentación técnica. Todas las decisiones de arquitectura, modelado de datos, seguridad y lógica de negocio pasan estrictamente por mi validación profesional.
