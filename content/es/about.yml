title: Sobre Mí
description: Desarrollador Web Full Stack con enfoque DevOps, Analista de Sistemas y Profesor de Informática.
intro: |
  ¡Hola! Soy Maikel Carballo, un apasionado Desarrollador Web Full Stack con conocimientos de DevOps y Profesor de Informática residenciado en La Guaira, Venezuela. Mi objetivo principal es construir software de alta calidad que no solo cumpla con los requisitos técnicos, sino que también agilice los procesos operativos y entregue valor real a las organizaciones y negocios.

  ### El Ingeniero de Software y Profesor

  Con una trayectoria de más de seis años en desarrollo de software, he tenido el privilegio de diseñar, construir y mantener sistemas críticos en el sector público venezolano. Desde 2021 me desempeño como Analista de Sistemas en una institución financiera pública, donde he liderado el desarrollo de plataformas internas para la administración integral de riesgos operacionales, la gestión de eventos institucionales y la coordinación de procesos de liquidación financiera y certificaciones laborales.

  En este rol he abordado retos complejos de ingeniería del mundo real: desde la migración de sistemas de escritorio heredados (Visual Basic 6 y SQL Server 2005) hacia aplicaciones web modernas sobre **PostgreSQL** —implementando asistentes de depuración progresiva de datos bajo la filosofía **Strangler Fig** para sanear bases de datos históricas altamente inconsistentes—, hasta la resolución de incidencias críticas en sistemas ERP de terceros.

  Para elevar la calidad y velocidad de entrega del equipo, creé un *starter kit* corporativo interno basado en **Laravel, Inertia.js, Vue.js, TypeScript y Tailwind CSS** alineado a las políticas institucionales, e implementé la automatización de despliegues mediante **Docker, Nginx, Container Registry y pipelines CI/CD en GitLab self-hosted con GitLab Runners**. Previamente me desempeñé como Analista Programador y cultivé mi vocación docente como Profesor de Programación en la Universidad Nueva Esparta (UNE), experiencia que fortalece mi capacidad para comunicar conceptos técnicos con claridad y estructurar soluciones mantenibles.
