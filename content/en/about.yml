seo:
  title: "About Maikel Carballo | Full Stack Developer & DevOps"
  description: "Learn more about Maikel Carballo, a Full Stack Web Developer, Systems Analyst, and IT Professor with over 6 years of experience in Laravel, Vue.js, PostgreSQL, and Docker."
  keywords: "biography, background, experience, full stack developer, devops, systems analyst, it professor, laravel, vue, docker, gitlab ci"
title: About Me
description: Full Stack Web Developer with a DevOps focus, Systems Analyst, and IT Professor.
intro: |
  Hello! I'm Maikel Carballo, a passionate Full Stack Web Developer with DevOps expertise and IT Professor based in La Guaira, Venezuela. My main goal is to build high-quality software that not only meets technical requirements, but also streamlines operational workflows and delivers real value to organizations and businesses.

  ### The Software Engineer & Professor

  With a track record of over six years in software development, I have had the privilege of designing, building, and maintaining mission-critical systems in the Venezuelan public sector. Since 2021, I have served as a Systems Analyst at a public financial institution, leading the development of internal platforms for comprehensive operational risk management, institutional event coordination, and financial liquidation workflows including employment certification management.

  In this role, I have tackled complex real-world engineering challenges: from migrating legacy desktop applications (Visual Basic 6 and SQL Server 2005) to modern web platforms backed by **PostgreSQL**—implementing guided data-scrubbing assistants following the **Strangler Fig** philosophy to clean up highly inconsistent historical databases—to debugging and stabilizing complex third-party ERP systems.

  To standardize development and accelerate delivery, I built an internal corporate starter kit powered by **Laravel, Inertia.js, Vue.js, TypeScript, and Tailwind CSS** tailored to institutional policies, and implemented automated deployment workflows using **Docker, Nginx, Container Registry, and self-hosted GitLab CI/CD pipelines with GitLab Runners**. Previously, I worked as a Programmer Analyst and cultivated my passion for teaching as a Programming Professor at Universidad Nueva Esparta (UNE)—an experience that sharpens my ability to communicate technical concepts clearly and design maintainable architectures.
